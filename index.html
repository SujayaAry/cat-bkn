<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAT BKN - Computer Assisted Test</title>
<style>
  :root{
    --blue:#12409e; --blue-dark:#0d2f77; --blue-light:#3b82f6;
    --gold:#f2c14e; --red:#d64545; --green:#22a05a;
    --orange:#f59f1d; --purple:#5a5fd6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#eef4fb;color:#222;overflow-x:hidden}
  .page{display:none;min-height:100vh}
  .page.active{display:block}
  .hidden{display:none!important}
  button{cursor:pointer;font-family:inherit}

  /* ============ PANEL 1 : LOGIN ============ */
  #page-login{background:linear-gradient(180deg,#4d94ff,#2f7bf0);display:none;padding:90px 16px 50px}
  #page-login.active{display:flex;justify-content:center;align-items:center}
  .login-card{width:430px;max-width:95vw;margin:0 auto;background:linear-gradient(180deg,#a97b1e,#f7c65a);
    border-radius:14px;padding:100px 34px 34px;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.28)}
  .logo-wrap{position:absolute;top:-78px;left:50%;transform:translateX(-50%);width:160px;height:160px;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
  .field{display:flex;margin-bottom:14px;border-radius:6px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .field .icon{width:52px;background:var(--blue);display:grid;place-items:center;color:#fff;flex:none}
  .field input{flex:1;border:none;padding:14px 16px;font-size:14px;outline:none;background:#f6f6f6;color:#333}
  .btn-login{width:100%;background:var(--blue);color:#fff;border:none;padding:15px;font-size:16px;
    border-radius:6px;margin-top:8px;transition:.2s}
  .btn-login:hover{background:var(--blue-dark)}

  /* ============ PANEL 2 : PROFILE ============ */
  #page-profile{display:none;flex-direction:column}
  #page-profile.active{display:flex}
  .header-bar{background:var(--blue);color:var(--gold);font-weight:700;padding:14px 22px;font-size:18px}
  .profile-body{display:flex;gap:60px;padding:44px 40px;flex-wrap:wrap;background:#f4f6fb;flex:1}
  .profile-left{display:flex;flex-direction:column;gap:22px;align-items:flex-start}
  .photo-box{width:200px;height:230px;background:#c62828;color:#fff;font-weight:700;display:grid;
    place-items:center;text-align:center;font-size:20px;line-height:1.3;box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .btn-mulai{background:var(--purple);color:#fff;border:none;padding:14px 26px;font-size:15px;font-weight:700;
    letter-spacing:1px;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,.25);transition:.2s}
  .btn-mulai:hover{filter:brightness(1.1)}
  .profile-right{flex:1;min-width:280px;display:flex;flex-direction:column;gap:18px;font-size:17px}
  .p-row label{font-weight:600;color:#444;display:block;margin-bottom:6px}
  .p-row div{background:#fff;border:1px solid #dfe5ee;border-radius:6px;padding:10px 16px;font-weight:600}
  .profile-footer{height:130px;background:#5b93b2}

  /* ============ PANEL 3 & 4 : EXAM ============ */
  .exam-top{display:flex;gap:18px;align-items:stretch;padding:14px 18px;background:#f1f3f7;border-bottom:1px solid #d8dde6}
  .photo-small{width:90px;background:#c62828;color:#fff;font-weight:700;font-size:13px;display:grid;
    place-items:center;text-align:center;padding:8px;flex:none}
  .exam-head{flex:1;display:flex;flex-direction:column;gap:10px;justify-content:center}
  .exam-title{align-self:center;background:#101418;color:#fff;font-size:16px;padding:6px 22px;border-radius:4px}
  .progress{position:relative;height:18px;background:#cdd3ec;border-radius:10px;overflow:hidden}
  #progressBar{height:100%;width:0;background:var(--purple);transition:width .25s}
  #progressText{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:700}
  .exam-right{display:flex;flex-direction:column;gap:8px;align-items:stretch;justify-content:flex-start}
  .timer{background:#101418;color:#fff;font-size:22px;font-weight:700;padding:8px 18px;border-radius:6px;text-align:center}
  /* Animasi Kelap-Kelip Timer */
  @keyframes flashWarning {
    0%, 100% { background-color: #101418; color: #fff; } /* Hitam */
    50% { background-color: var(--red); color: #fff; }  /* Merah */
  }
  
  .timer.warning-flash {
    animation: flashWarning 1s infinite;
  }
  .btn-selesai{background:var(--orange);color:#fff;border:none;font-weight:700;font-size:13px;letter-spacing:1px;
    padding:9px 14px;border-radius:6px;display:flex;align-items:center;gap:6px;justify-content:center;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,159,29,.5)}50%{box-shadow:0 0 0 8px rgba(245,159,29,0)}}
  
  .exam-main{display:flex;min-height:calc(100vh - 110px)}
  .grid-panel{width:200px;flex:none;padding:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
    align-content:start;background:#f7f8fa;border-right:1px solid #d8dde6;overflow-y:auto;max-height:calc(100vh - 110px)}
  .qnum{border:none;color:#fff;font-weight:700;font-size:11px;padding:7px 0;border-radius:5px}
  .qnum.unanswered{background:#d94a4a}
  .qnum.answered{background:var(--green)}
  .qnum.current{background:#f2b31c;color:#222;outline:2px solid #222}
  
  .question-area{flex:1;display:flex;flex-direction:column;padding:0 26px 26px; overflow-y:auto;}
  
  /* REVISI: Layout Toggle pada Section Header */
  .section-header {
    background: var(--blue); color: var(--gold); font-size: 13px; font-weight: 600;
    padding: 10px 16px; margin: 0 -26px 26px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .switch { position: relative; display: inline-block; width: 36px; height: 18px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background-color: #0d2f77; border: 1px solid #4a6eb8; transition: .3s; border-radius: 20px; }
  .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background-color: #fff; transition: .3s; border-radius: 50%; }
  input:checked + .slider { background-color: var(--green); border-color: var(--green); }
  input:checked + .slider:before { transform: translateX(18px); }
  
  .q-content {font-size: 16px; color: #222; margin-bottom: 24px; line-height: 1.6; padding-left: 12px;}
  
  /* REVISI: Opsi Jawaban Vertikal & Horizontal */
  #options { display: flex; flex-direction: column; gap: 10px; }
  .option{display:flex;align-items:center;gap:14px;padding:9px 12px;border-radius:8px;cursor:pointer;max-width:520px;border:1px solid transparent;}
  .option:hover{background:#e9f0ff}
  .letter{font-weight:600;color:#555;width:22px}
  .radio{width:26px;height:26px;border-radius:50%;background:#c9ced8;display:grid;place-items:center;flex:none;transition:.15s}
  .option.selected .radio{background:#fff;border:3px solid var(--green)}
  .dot{width:12px;height:12px;background:var(--green);border-radius:50%}
  .opt-text{font-size:15px}
  
  /* Tambahan Class Horizontal */
  #options.horizontal { flex-direction: row; flex-wrap: wrap; column-gap: 20px; }
  #options.horizontal .option { width: auto; min-width: 150px; padding-right: 20px; }

  .q-actions{margin-top:auto;padding-top:22px;display:flex;gap:12px;flex-wrap:wrap}
  .btn-simpan{background:var(--purple);color:#fff;border:none;font-weight:700;font-size:13px;letter-spacing:.5px;
    padding:12px 20px;border-radius:6px;display:flex;align-items:center;gap:8px}
  .btn-lewat{background:var(--orange);color:#fff;border:none;font-weight:700;font-size:13px;letter-spacing:.5px;
    padding:12px 20px;border-radius:6px;display:flex;align-items:center;gap:8px}

  /* ============ PANEL 5 : MODAL ============ */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,25,55,.45);backdrop-filter:blur(5px);
    display:grid;place-items:center;z-index:50}
  .modal-card{background:#fff;width:430px;max-width:92vw;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #e5e8ef}
  .modal-head h3{font-size:16px}
  .modal-x{background:none;border:none;font-size:20px;color:#888;line-height:1}
  .modal-card p{padding:22px 20px;font-size:14px;color:#444}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;padding:0 20px 20px}
  .btn-batal{background:#2a8fa8;color:#fff;border:none;padding:10px 20px;border-radius:6px;font-weight:600}
  .btn-ya{background:#d64545;color:#fff;border:none;padding:10px 24px;border-radius:6px;font-weight:600}

  /* ============ PANEL 6 : SCORE ============ */
  .score-head{display:flex;align-items:center;gap:10px}
  .title-chip{background:#101418;color:#fff;font-size:15px;font-weight:400;padding:6px 20px;border-radius:4px}
  .score-body{max-width:760px;margin:0 auto;background:#f7f9fc;padding:44px 40px;min-height:calc(100vh - 52px)}
  .s-row{display:flex;align-items:center;margin-bottom:16px;font-size:17px}
  .s-row label{width:180px;font-weight:600;color:#333}
  .s-row span{width:20px;color:#333}
  .s-row b{font-weight:700}
  /* ============ PENGATURAN LAYAR HP (MOBILE RESPONSIVE) ============ */
  @media (max-width:760px) {
    .exam-main { flex-direction: column; }
    .grid-panel { width: 100%; max-height: 220px; }
    
    /* Mengurangi lebar label agar teks di kanannya punya lebih banyak ruang */
    .s-row label { width: 100px; font-size: 15px; } 
    .s-row { font-size: 15px; }
  }

  /* ============ TAMBAHAN CSS SUPPORT & CONTACT ============ */
  .divider { 
    border: 0; 
    border-top: 2px dashed #d8dde6; 
    margin: 30px 0 20px; 
  }
  .link-row a { 
    color: var(--blue); 
    text-decoration: none; 
    font-weight: 700; 
    transition: .2s; 
    flex: 1; /* Memaksa tautan mengambil sisa ruang yang ada */
    word-break: break-word; /* Jika teks tautan terlalu panjang, baru akan dipatahkan secara rapi */
    line-height: 1.4;
  }
  .link-row a:hover { 
    color: var(--orange); 
    text-decoration: underline; 
  }
</style>

<script>
// 1. Deklarasi Variabel Dinamis (Keranjang Kosong)
  let bankSoal = [];
  let TOTAL = 0;
  let answers = [];

  // 2. Fungsi Acak Opsi & Kunci Jawaban
  function acakOpsiJawaban() {
    bankSoal.forEach(q => {
      let urutan = [0, 1, 2, 3, 4];
      
      // Algoritma pengacak urutan
      for (let i = urutan.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [urutan[i], urutan[j]] = [urutan[j], urutan[i]];
      }
      
      // Menyusun ulang teks/gambar opsi
      let opsiBaru = [];
      urutan.forEach(idx => opsiBaru.push(q.opsi[idx]));
      
      // Menyesuaikan posisi kunci jawaban (TWK/TIU) atau bobot nilai (TKP)
      if (q.kunci !== undefined) {
        q.kunci = urutan.indexOf(q.kunci);
      } else if (q.bobot !== undefined) {
        let bobotBaru = [];
        urutan.forEach(idx => bobotBaru.push(q.bobot[idx]));
        q.bobot = bobotBaru;
      }
      
      q.opsi = opsiBaru;
    });
  }

  // 3. Pusat Kendali: Tombol Login
  $('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    
    // Menangkap input PIN Sesi
    const pinSesi = $('inSesi').value.trim();
    
    // Memanggil fungsi dari file pin-sesi.js secara diam-diam
    bankSoal = muatSoalBerdasarkanPin(pinSesi);

    // Inisialisasi kapasitas ujian setelah soal dirakit
    TOTAL = bankSoal.length;
    answers = Array(TOTAL).fill(null);
    
    // Eksekusi pengacakan opsi khusus untuk paket yang terpilih
    acakOpsiJawaban(); 

    // Fitur layar penuh (Full Screen)
    masukFullScreen(); 
    
    // Menampilkan data peserta ke halaman Profil
    $('pNik').textContent = $('inNik').value.trim() || '1234567890123456';
    $('pPeserta').textContent = $('inPeserta').value.trim() || 'P-1234567';
    
    // Transisi ke layar berikutnya
    showPage('page-profile');
  });

  /* Profile -> Exam */
  $('btnMulai').addEventListener('click', () => {
    buildGrid(); 
    goToQuestion(0); 
    updateProgress(); 
    startTimer();
    showPage('page-exam');
  });

  function buildGrid(){
    const g = $('grid'); g.innerHTML = '';
    for (let i = 0; i < TOTAL; i++){
      const b = document.createElement('button');
      b.textContent = i + 1;
      b.onclick = () => { goToQuestion(i); };
      g.appendChild(b);
    }
    updateGrid();
  }

  function updateGrid(){
    const btns = $('grid').children;
    for (let i = 0; i < TOTAL; i++){
      btns[i].className = 'qnum ' + (answers[i] !== null ? 'answered' : 'unanswered') + (i === current ? ' current' : '');
    }
    return answers.filter(a => a !== null).length;
  }

  function updateProgress(){
    const n = updateGrid(), pct = Math.round(n / TOTAL * 100);
    $('progressBar').style.width = pct + '%';
    $('progressText').textContent = pct + '%';
    $('btnSelesai').classList.toggle('hidden', n !== TOTAL);
  }

  // REVISI: Fungsi pindah soal dipisah agar bisa me-reset tempAnswer
  function goToQuestion(index){
    current = index;
    tempAnswer = answers[current]; // Muat jawaban yang sudah tersimpan (jika ada)
    renderQuestion();
    updateGrid();
  }

  function renderQuestion(){
    // 1. Menampilkan soal dari file JS (Ini akan otomatis menghapus nomor soal manual)
    $('qContent').innerHTML = bankSoal[current].soal; 
      
    // 2. Menyesuaikan judul atas sesuai kategori soal
    $('sectionName').textContent = current < 30 ? 'TWK - Tes Wawasan Kebangsaan' 
                         : current < 65 ? 'TIU - Tes Intelegensia Umum' 
                         : 'TKP - Tes Karakteristik Pribadi';
                         
    const box = $('options'); box.innerHTML = '';
    
    // 3. Merender 5 opsi jawaban (A, B, C, D, E)
    for (let i = 0; i < 5; i++){
      const lab = document.createElement('div');
      lab.className = 'option' + (tempAnswer === i ? ' selected' : '');
      const letter = document.createElement('span'); letter.className = 'letter'; letter.textContent = 'ABCDE'[i] + '.';
      const radio = document.createElement('span'); radio.className = 'radio';
      if (tempAnswer === i){ const d = document.createElement('span'); d.className = 'dot'; radio.appendChild(d); }
      
      const txt = document.createElement('span'); 
      txt.className = 'opt-text';
      // Mengambil teks atau gambar opsi jawaban langsung dari file JS
      txt.innerHTML = bankSoal[current].opsi[i]; 
      
      lab.append(letter, radio, txt);
      
      lab.onclick = () => { 
        tempAnswer = i; 
        renderQuestion(); 
      };
      box.appendChild(lab);
    }
    // Pastikan ekstensi auto-render sudah termuat
    if (window.renderMathInElement) {
      renderMathInElement(document.getElementById('qContent'), {
        delimiters: [
          {left: '$$', right: '$$', display: true}, // Untuk rumus besar/tengah
          {left: '$', right: '$', display: false}   // Untuk rumus sejajar teks
        ],
        throwOnError: false
      });
      renderMathInElement(document.getElementById('options'), {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ],
        throwOnError: false
      });
    }
  }

  // REVISI: Logic Toggle Susunan Opsi (Mendatar / Menurun)
  $('layoutToggle').addEventListener('change', function(e) {
    if (e.target.checked) {
      $('options').classList.add('horizontal');
    } else {
      $('options').classList.remove('horizontal');
    }
  });

  function fmt(t){
    const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }
  
  function startTimer(){
    $('timer').textContent = fmt(timeLeft);
    timerId = setInterval(() => {
      timeLeft--; 
      $('timer').textContent = fmt(timeLeft);
      
      // Jika waktu tersisa 5 menit (300 detik) atau kurang, nyalakan efek kelap-kelip
      if (timeLeft <= 300 && timeLeft > 0) {
        $('timer').classList.add('warning-flash');
      }
      
      if (timeLeft <= 0) finish();
    }, 1000);
  }

  // REVISI: Tombol Simpan & Lanjutkan baru akan menyimpan tempAnswer ke array answers[]
  $('btnSimpan').onclick = () => { 
    if (tempAnswer !== null) {
      answers[current] = tempAnswer; 
    }
    updateProgress();
    goToQuestion((current + 1) % TOTAL); 
  };
  
  // REVISI: Tombol Lewatkan tidak menyimpan perubahan terakhir
  $('btnLewatkan').onclick = () => { 
    goToQuestion((current + 1) % TOTAL); 
  };

  /* SELESAI -> modal */
  $('btnSelesai').onclick = () => $('modal').classList.remove('hidden');
  $('btnBatal').onclick = () => $('modal').classList.add('hidden');
  $('btnX').onclick = () => $('modal').classList.add('hidden');
  $('btnYa').onclick = finish;

  function computeScores(){
    let twk = 0, tiu = 0, tkp = 0;
    answers.forEach((a, i) => {
      if (a === null) return;
      
      if (i < 30) {
        // 30 Soal TWK: Bernilai 5 jika jawaban (a) sama dengan kunci
        twk += (a === bankSoal[i].kunci ? 5 : 0); 
      } else if (i < 65) {
        // 35 Soal TIU: Bernilai 5 jika jawaban (a) sama dengan kunci
        tiu += (a === bankSoal[i].kunci ? 5 : 0); 
      } else {
        // 45 Soal TKP: Mengambil nilai bobot berjenjang dari array di file JS
        tkp += bankSoal[i].bobot[a]; 
      }
    });
    return { twk, tiu, tkp, total: twk + tiu + tkp };
  }

  function finish(){
    clearInterval(timerId);
    $('modal').classList.add('hidden');
    const s = computeScores();
    $('sNama').textContent = $('pNama').textContent;
    $('sPeserta').textContent = $('pPeserta').textContent;
    $('sTwk').textContent = s.twk; $('sTiu').textContent = s.tiu;
    $('sTkp').textContent = s.tkp; $('sTotal').textContent = s.total;
    showPage('page-score');

    // ================= FITUR UNDUH OTOMATIS =================
    // Membuat elemen link tersembunyi
    const linkUnduh = document.createElement('a');
    
    // Alamat file PDF di GitHub Anda (sesuaikan jika namanya berbeda)
    linkUnduh.href = 'pembahasan.pdf'; 
    
    // Nama file yang akan muncul saat tersimpan di HP/Laptop peserta
    linkUnduh.download = 'Pembahasan_TryOut_JLC_2026.pdf'; 
    
    // Memerintahkan sistem untuk mengklik link tersebut secara otomatis
    document.body.appendChild(linkUnduh);
    linkUnduh.click();
    document.body.removeChild(linkUnduh);
    // ========================================================
  }

  // Fungsi untuk memicu mode layar penuh (Full Screen)
  function masukFullScreen() {
    const elem = document.documentElement;
    if (!document.fullscreenElement) {
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(err => console.log("Gagal full screen:", err));
      } else if (elem.webkitRequestFullscreen) { /* Untuk Safari */
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) { /* Untuk browser lawas */
        elem.msRequestFullscreen();
      }
    }
  }

  // Trik: Memicu Full Screen pada klik/sentuhan PERTAMA di mana saja pada layar
  document.body.addEventListener('click', function triggerFullScreen() {
    masukFullScreen();
    // Setelah berhasil full screen pada klik pertama, hapus event listener ini
    // agar tidak terus-terusan memanggil fungsi di setiap klik peserta
    document.body.removeEventListener('click', triggerFullScreen);
  }, { once: true });
</script>
</body>
